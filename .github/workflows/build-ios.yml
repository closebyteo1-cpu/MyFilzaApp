name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Add iOS Platform
      run: |
        npx cap add ios
        npx cap sync ios

    - name: Build Xcode Project (Unsigned IPA)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO

    - name: Package Payload into IPA
      run: |
        mkdir -p Payload
        cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r MyFilzaApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyFilzaApp-IPA
        path: MyFilzaApp.ipa