name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npx cap init --force

      - name: Add iOS Platform
        run: |
          npx cap add ios

      - name: Copy Web Assets to iOS
        run: |
          npx cap copy ios

      # Lưu ý: Để xuất file .ipa chạy thật trên máy, cần thêm bước cấu hình chứng chỉ ký tên (.p12 và .mobileprovision) vào đây.
      # Nếu chỉ test cấu trúc Xcode, GitHub Actions sẽ biên dịch mã nguồn thành công và trả về thư mục Build.
