<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt Magic App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 80px 20px;
            background-color: #f2f2f7;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 350px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            color: #000;
            margin-bottom: 10px;
        }
        p {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-install {
            display: inline-block;
            padding: 16px 32px;
            background-color: #007aff;
            color: white;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            transition: background 0.2s;
        }
        .btn-install:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Magic App iOS</h1>
        <p>Bấm nút bên dưới bằng trình duyệt <b>Safari</b> để cài đặt ứng dụng trực tiếp về máy.</p>
        
        <!-- Đường dẫn itms-services đặc biệt giúp kích hoạt OTA -->
        <a class="btn-install" href="itms-services://?action=download-manifest&url=https://closebyteo1-cpu.github.io/MyFilzaApp/manifest.plist">
            CÀI ĐẶT MAGIC APP
        </a>
    </div>

</body>
</html>
